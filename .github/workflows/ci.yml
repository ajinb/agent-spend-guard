name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest -q
      - name: Price table is well-formed
        run: agent-spend-guard prices
      - name: Demo runs offline
        run: agent-spend-guard demo
      - name: Examples run offline
        run: |
          python examples/runaway_demo.py
          python examples/degradation_ladder_demo.py
